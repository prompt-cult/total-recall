[package]
name = "inception-mercury-compaction"
version = "0.1.0"
edition = "2024"
authors = ["Consensus Solutions"]
description = "Rust CLI for compacting agent session rollouts using Inception Mercury 2.5"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
memmap2 = "0.9"
reqwest = { version = "0.12", features = ["json"] }
dotenvy = "0.15"
rmcp = { version = "3.3", features = ["server", "transport-io"] }
schemars = "0.8"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "read_rollout"
harness = false

[[example]]
name = "profile"

[[example]]
name = "extract"

[[example]]
name = "throughput"
