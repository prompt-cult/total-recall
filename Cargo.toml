[package]
name = "inception-mercury-compaction"
version = "0.1.0"
edition = "2024"
authors = ["Consensus Solutions"]
description = "Rust CLI for compacting agent session rollouts using Inception Mercury 2.5"

[dependencies]
axonerai = { git = "ssh://git@github.com/simbo1905/axonerai.git", tag = "20260910_f4c6951" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
memmap2 = "0.9"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
dotenvy = "0.15"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "read_rollout"
harness = false

[[example]]
name = "profile"

[[example]]
name = "extract"

[[example]]
name = "throughput"
