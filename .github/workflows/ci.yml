name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Push-triggered and PR-synced: a superseded run for the same ref can never
# change this commit's result, so the older one is cancelled instead of billed.
# No `paths-ignore` here, deliberately: this workflow is the only producer of
# the `test (<os>)` status contexts required on `main`, and a filtered run
# reports no context at all, which leaves a docs-only PR unmergeable.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, blacksmith-4vcpu-windows-2025]
    runs-on: ${{ matrix.os }}
    # Tests, clippy and rustfmt over three runners; the slowest leg is the
    # cold Windows build. 30 minutes is generous for it and still bounds a hang.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --check
