name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64 (macos-latest = macOS 26 arm64; proven pickup in CI).
          - os: macos-latest
            arch: aarch64
            platform: macos
            triple: aarch64-apple-darwin
          # macOS x86_64: macos-13 was retired 2025-12-04 (jobs queue forever);
          # macos-15-intel is GitHub's documented free-tier replacement.
          - os: macos-15-intel
            arch: x86_64
            platform: macos
            triple: x86_64-apple-darwin
          # Windows not built (20-min build too slow without Blacksmith):
          #   - os: windows-latest
          #     arch: x86_64
          #     platform: windows
          #     triple: x86_64-pc-windows-msvc
          # Linux x86_64
          - os: ubuntu-latest
            arch: x86_64
            platform: linux
            triple: x86_64-unknown-linux-gnu
          # Linux ARM64
          - os: ubuntu-24.04-arm
            arch: aarch64
            platform: linux
            triple: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # Tag-stripped version: v0.7.0 -> 0.7.0. Same value on every runner, so
      # the archive name is identical no matter which matrix leg built it.
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      # The archive name is the contract with mise/aqua/ubi: <name>_<version>_<target-triple>.tar.gz
      # (goreleaser's convention). mise's asset autodetection reads the OS token
      # (darwin/linux), the arch token (x86_64/aarch64) and the libc token (gnu)
      # straight out of the triple, and takes the single executable at the
      # archive root as the installed binary. A triple needs no `matching=` hint
      # in the user's config, and the aqua registry maps the same three fields.
      - name: Stage archive
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          NAME="total-recall_${VERSION}_${{ matrix.triple }}.tar.gz"
          mkdir -p dist
          cp target/release/total-recall dist/total-recall
          # Reproducible archive: zeroed mtime, uid/gid 0 and a fixed ustar format
          # so the same source tree yields the same bytes. `touch -d @0` (rather
          # than `tar --mtime=@0`) because BSD tar, which ships on the macOS
          # runners, has no --mtime; `gzip -n` drops the filename/timestamp the
          # gzip wrapper would otherwise record.
          # No --uname/--gname: those exist only in bsdtar, and GNU tar on the
          # Linux runners rejects them (v0.8.0's first release run died on
          # "tar: unrecognized option '--uname=root'"). --owner/--group pin the
          # uid/gid fields both implementations write.
          touch -d @0 dist/total-recall
          tar --format=ustar --owner=0 --group=0 --numeric-owner \
              -C dist -cf - total-recall | gzip -n -9 > "dist/$NAME"
          rm dist/total-recall
          tar -tzf "dist/$NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: total-recall-${{ matrix.triple }}
          path: dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # `SHA256SUMS` is the filename mise's checksum fetcher looks for
      # (asset_matcher.rs CHECKSUM_EXTENSIONS / global_patterns) and the one
      # `sha256sum --check` and aqua both read. Lines are
      # "<64 hex>  <asset name>", which mise parses and matches on the
      # asset name; the name must therefore be the bare filename, not a path.
      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft=false --generate-notes dist/*
