name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: both Intel and Apple Silicon
          - os: macos-13
            arch: x86_64
            platform: macos
          - os: macos-latest
            arch: aarch64
            platform: macos
          # Linux x86_64
          - os: ubuntu-latest
            arch: x86_64
            platform: linux
          # Linux ARM64
          - os: ubuntu-24.04-arm
            arch: aarch64
            platform: linux
          # Windows — NOT included in v0.1.0 (20-min build too slow without Blacksmith).
          # Add this entry back in v0.1.1:
          #   - os: windows-latest
          #     arch: x86_64
          #     platform: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Stage binary
        run: |
          BIN=inception-mercury-compaction
          mkdir -p dist
          cp "target/release/$BIN" "dist/inception-mercury-compaction-${{ matrix.platform }}-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: inception-mercury-compaction-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft=false --generate-notes dist/*
