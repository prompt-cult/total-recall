name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64 (macos-latest = macOS 26 arm64; proven pickup in CI).
          - os: macos-latest
            arch: aarch64
            platform: macos
          # macOS x86_64: macos-13 was retired 2025-12-04 (jobs queue forever);
          # macos-15-intel is GitHub's documented free-tier replacement.
          - os: macos-15-intel
            arch: x86_64
            platform: macos
          # Windows not built (20-min build too slow without Blacksmith):
          #   - os: windows-latest
          #     arch: x86_64
          #     platform: windows
          # Linux x86_64
          - os: ubuntu-latest
            arch: x86_64
            platform: linux
          # Linux ARM64
          - os: ubuntu-24.04-arm
            arch: aarch64
            platform: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Stage binary
        run: |
          BIN=inception-mercury-compaction
          mkdir -p dist
          cp "target/release/$BIN" "dist/inception-mercury-compaction-${{ matrix.platform }}-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: inception-mercury-compaction-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft=false --generate-notes dist/*
